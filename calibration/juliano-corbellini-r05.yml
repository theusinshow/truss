# Politicas confirmadas nas secoes 1 a 6 do formulario. Sao insumo para propostas de
# regra, nao regras ativas: nenhuma foi transformada automaticamente em rule pack.
policies:
  aggressiveness: balanced                       # 1.2
  inconclusive_outcome: [NOT_VERIFIABLE, ATTENTION_POINT]   # 1.3
  title_per_view: required                       # 2.1
  title_grouping_allowed: true                   # 2.1, observacao do proprietario
  scale_per_view: required                       # 2.2
  scale_may_be_shared_by_group: true             # 2.2
  scale_indicada_accepted: true                  # 2.2
  view_numbering: required                       # 2.4
  duplicate_identifier_outcome: ATTENTION_POINT  # 2.4
  category_mismatch_outcome: INCONSISTENCY       # 4.1
  category_mismatch_severity: MEDIUM             # 4.1
  table_vs_drawing_mismatch_outcome: ATTENTION_POINT  # 4.2
  authoritative_source_on_conflict: none         # 4.2

# Contradicoes internas do formulario. Nao resolver sem decisao humana explicita.
open_questions:
  - id: scale_required_vs_optional
    question: >-
      A secao 2.2 marca "escala por view: sim, sempre", mas a tabela da secao 3 marca
      "Escala de cada planta" como N (nao obrigatorio). Qual prevalece?
    status: needs_human_confirmation
  - id: level_required_vs_preference
    question: >-
      A secao 2.3 marca "nivel no titulo da view", e a tabela da secao 3 marca "Nivel de
      cada planta" como P (preferencia pessoal). O texto livre diz "acho melhor padronizar
      para sempre ter". Regra geral ou preferencia do escritorio?
    status: needs_human_confirmation
  - id: sheet_category_is_preference
    question: >-
      "Categoria/tipo da prancha" foi marcada como P. Isso torna a regra de coerencia
      carimbo-versus-conteudo (4.1) uma preferencia, apesar de 4.1 pedir INCONSISTENCY?
    status: needs_human_confirmation
  - id: level_raw_values_not_normalized
    question: >-
      Os niveis foram registrados como -650, -350, -167, -04, 338, 680, 780, 940,
      "varios" e "338 → 680 principalmente". A unidade e a convencao de sinal nao foram
      declaradas. Nenhum foi normalizado.
    status: needs_human_confirmation
  - id: empty_finding_tables
    question: >-
      Todas as tabelas de findings ficaram vazias. Isso significa zero findings esperados
      nessas folhas, ou apenas que nao foram preenchidas?
    status: needs_human_confirmation
  - id: personal_rules_section_empty
    question: "A secao 8, de regras pessoais do proprietario, ficou vazia."
    status: needs_human_confirmation
