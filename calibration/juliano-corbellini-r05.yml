# Politicas confirmadas nas secoes 1 a 6 do formulario. Sao insumo para propostas de
# regra, nao regras ativas: nenhuma foi transformada automaticamente em rule pack.
policies:
  aggressiveness: balanced                       # 1.2
  inconclusive_outcome: [NOT_VERIFIABLE, ATTENTION_POINT]   # 1.3
  title_per_view: required                       # 2.1
  title_grouping_allowed: true                   # 2.1, observacao do proprietario
  scale_per_view: required                       # 2.2
  scale_may_be_shared_by_group: true             # 2.2
  scale_indicada_accepted: true                  # 2.2
  view_numbering: required                       # 2.4
  duplicate_identifier_outcome: ATTENTION_POINT  # 2.4
  category_mismatch_outcome: INCONSISTENCY       # 4.1
  category_mismatch_severity: MEDIUM             # 4.1
  table_vs_drawing_mismatch_outcome: ATTENTION_POINT  # 4.2
  authoritative_source_on_conflict: none         # 4.2

# Contradicoes internas do formulario. Nao resolver sem decisao humana explicita.
open_questions:
  # Quatro das seis foram respondidas por forms-policy-decisions-v1.md.
  - id: scale_required_vs_optional
    status: resolved
    resolution: >-
      Toda view tecnica precisa de escala numerica propria, escala compartilhada pelo grupo, ou
      ESCALA INDICADA valida. Perspectivas e representacoes auxiliares estao isentas.
  - id: level_required_vs_preference
    status: resolved
    resolution: >-
      Regra geral e leniente: base/topo podem ser compreensiveis sem nivel. A exigencia de nivel
      sempre e preferencia do proprietario e vive no rule pack pessoal, nao no geral.
    consequence: dois rule packs separados - formas_geral e formas_pessoal
  - id: sheet_category_is_preference
    status: resolved
    resolution: >-
      Carimbo de planta de formas com conteudo dominante de outro tipo gera INCONSISTENCY de
      severidade MEDIUM. E regra geral, nao preferencia.
  - id: level_raw_values_not_normalized
    status: resolved
    resolution: >-
      Tabela de normalizacao confirmada pelo proprietario. Texto bruto preservado junto do valor
      normalizado em todas as views.
  - id: empty_finding_tables
    status: partially_resolved
    resolution: >-
      Confirmado zero findings no escopo de calibracao de views para EST-0050-B a EST-0090-B.
      EST-0260-A permanece sem confirmacao ate a ressalva ser descrita.
  - id: est_0260_a_reservation
    status: needs_human_confirmation
    question: "A folha foi marcada com ressalvas, mas a ressalva tecnica nao foi descrita."
  - id: personal_rules_section_empty
    status: partially_resolved
    resolution: >-
      A secao 8 do formulario ficou vazia, mas o documento de politicas registra a exigencia de
      nivel sempre como preferencia do proprietario.

